<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Império da Barba | Cartão Digital Premium</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- Favicon -->
  <link rel="shortcut icon" href="./assets/Imperio_da_barba-icon.png" type="image/x-icon">
</head>

<body>

  <div class="card-container">
    <div class="card">

      <!-- DECORAÇÃO DE FUNDO -->
      <div class="card-bg-decoration">
        <div class="glow-1"></div>
        <div class="glow-2"></div>
      </div>

      <!-- TOP BAR -->
      <div class="top-bar">
        <button class="theme-toggle" id="themeToggle" aria-label="Alternar tema">
          <i class="fas fa-moon"></i>
        </button>
        <button class="share-btn" id="shareBtn" aria-label="Compartilhar cartão">
          <i class="fas fa-share-alt"></i> Compartilhar
        </button>
      </div>

      <!-- MODAL DE COMPARTILHAMENTO -->
      <div class="share-modal" id="shareModal">
        <div class="share-modal-content">
          <button class="close-share" id="closeShare"><i class="fas fa-times"></i></button>
          
          <h3><i class="fas fa-share-alt"></i> Compartilhar Cartão</h3>
          <p class="share-subtitle">Compartilhe seu cartão digital profissional</p>

          <div class="share-actions">
            <button class="share-action" id="copyLinkBtn">
              <i class="fas fa-copy"></i> Copiar Link
            </button>
            <button class="share-action primary" id="shareLinkBtn">
              <i class="fas fa-share"></i> Compartilhar
            </button>
          </div>

          <div class="qr-box">
            <div class="qr-container">
              <img class="qr"
                src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://imperio-da-barba.vercel.app"
                alt="QR Code do Cartão Digital Império da Barba">
              <img class="qr-center" src="./assets/Imperio_da_barba-icon.png" alt="Logo Império da Barba">
            </div>
            <p><i class="fas fa-qrcode"></i> Escaneie o QR Code</p>
          </div>
        </div>
      </div>

      <!-- PERFIL -->
      <div class="profile">
        <div class="avatar-wrapper">
          <div class="avatar-ring"></div>
          <div class="avatar">
            <img src="./assets/Imperio da barba-logo1.png" alt="Império da Barba">
          </div>
          <div class="status-dot"></div>
        </div>

        <h1>Império da Barba</h1>
        <p class="subtitle">Premium | Visagismo & Imagem</p>
        <div class="badge">
          <i class="fas fa-star"></i>
          <span>Referência em Posicionamento</span>
          <i class="fas fa-star"></i>
        </div>
      </div>

      <!-- UNIDADES -->
      <div class="units">
        <div class="unit-card">
          <div class="unit-header">
            <span class="unit-tag"><i class="fas fa-store"></i> Unidade 01</span>
            <span class="unit-status"><i class="fas fa-circle"></i> Aberto</span>
          </div>
          <div class="unit-actions">
            <a href="https://sites.appbarber.com.br/imperiodabarba-9isd" class="btn-primary" target="_blank">
              <i class="fas fa-calendar-check"></i> Agendar
            </a>
            <a href="https://wa.me/5583988643180?text=Olá!%20Gostaria%20de%20agendar%20um%20atendimento." class="btn-whatsapp" target="_blank">
              <i class="fab fa-whatsapp"></i>
            </a>
            <a href="https://maps.app.goo.gl/cZtEB3QAiUYFK7H7A" class="btn-location" target="_blank">
              <i class="fas fa-map-pin"></i>
            </a>
          </div>
        </div>

        <div class="unit-divider"></div>

        <div class="unit-card">
          <div class="unit-header">
            <span class="unit-tag"><i class="fas fa-store"></i> Unidade 02</span>
            <span class="unit-status"><i class="fas fa-circle"></i> Aberto</span>
          </div>
          <div class="unit-actions">
            <a href="https://sites.appbarber.com.br/imperiodabarbap-ae39" class="btn-primary" target="_blank">
              <i class="fas fa-calendar-check"></i> Agendar
            </a>
            <a href="https://wa.me/5583991653577?text=Olá!%20Gostaria%20de%20agendar%20um%20atendimento." class="btn-whatsapp" target="_blank">
              <i class="fab fa-whatsapp"></i>
            </a>
            <a href="https://share.google/BJNUiloNqug0gjksv" class="btn-location" target="_blank">
              <i class="fas fa-map-pin"></i>
            </a>
          </div>
        </div>
      </div>

      <!-- APP BUTTON -->
      <a href="https://play.google.com/store/apps/details?id=br.com.starapp.appbarbercli" class="btn-app" target="_blank">
        <i class="fas fa-download"></i> Baixar App da Barbearia
      </a>

      <!-- RODAPÉ -->
      <div class="footer">
        <div class="social-footer">
          <a href="https://wa.me/5583988643180?text=Olá!%20Gostaria%20de%20agendar%20um%20atendimento." target="_blank" aria-label="WhatsApp 01" class="social-link">
            <i class="fab fa-whatsapp"></i>
          </a>
          <a href="https://wa.me/5583991653577?text=Olá!%20Gostaria%20de%20agendar%20um%20atendimento." target="_blank" aria-label="WhatsApp 02" class="social-link">
            <i class="fab fa-whatsapp"></i>
          </a>
          <a href="https://instagram.com/imperiodabarba.oficial" target="_blank" aria-label="Instagram" class="social-link">
            <i class="fab fa-instagram"></i>
          </a>
          <a href="https://maps.app.goo.gl/cZtEB3QAiUYFK7H7A" target="_blank" aria-label="Localização" class="social-link">
            <i class="fas fa-map-marker-alt"></i>
          </a>
        </div>

        <p class="copyright">
          &copy; 2026 Império da Barba | Todos os direitos reservados
        </p>
      </div>

    </div>
  </div>

  <!-- JS -->
  <script src="script.js"></script>

</body>
</html>
